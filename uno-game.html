function el(tag, cls){ var e=document.createElement(tag); if(cls) e.className=cls; return e; }

function buildCardEl(card, faceUp){
  var c = el('div','card');
  if(card && card.id!==undefined){ c.setAttribute('data-card-id', String(card.id)); }
  if(!faceUp){
    c.classList.add('back');
    c.appendChild(el('div','stripe'));
    var backBadge = el('div','back-badge');
    var backText = el('span','back-uno'); backText.textContent='UNO';
    backBadge.appendChild(backText);
    c.appendChild(backBadge);
    return c;
  }
  c.classList.add(card.color);
  c.setAttribute('data-card-type', card.type);
  c.appendChild(el('div','stripe'));
  var badge = el('div','badge');
  var sym = cardSymbol(card);
  var center = el('div','center-symbol'); center.textContent = sym;
  badge.appendChild(center);
  var tl = el('div','corner tl'); tl.textContent = sym;
  var br = el('div','corner br'); br.textContent = sym;
  c.appendChild(badge); c.appendChild(tl); c.appendChild(br);
  return c;
}

function layoutFan(container, cards, faceUp, opts){
  opts = opts || {};
  container.innerHTML='';
  var n = cards.length;
  if(n===0) return;
  var angleStep = n<=1?0:Math.min(9, 56/n);
  var spacing = Math.min(46, 460/Math.max(n,1));
  cards.forEach(function(card, i){
    var mid=(n-1)/2, off=i-mid;
    var angle= off*angleStep;
    var x = off*spacing;
    var y = Math.abs(angle)*1.4;
    var slot = el('div','hand-slot');
    slot.style.transform = 'translateX(calc(-50% + '+x+'px)) translateY('+y+'px) rotate('+angle+'deg)';
    slot.style.zIndex = String(i);
    var cardEl = buildCardEl(card, faceUp);
    if(opts.playableCheck){
      var can = opts.playableCheck(card);
      cardEl.classList.add(can ? 'playable' : 'disabled');
      cardEl.tabIndex = can ? 0 : -1;
      cardEl.addEventListener('click', function(){ opts.onClick && opts.onClick(card); });
      cardEl.addEventListener('keydown', function(ev){ if((ev.key==='Enter'||ev.key===' ') && can){ opts.onClick && opts.onClick(card); } });
    }
    slot.appendChild(cardEl);
    container.appendChild(slot);
  });
}

function renderDiscard(cards, skipLandingAnim){
  var wrap = document.getElementById('discard-stack');
  wrap.innerHTML='';
  cards.forEach(function(card, i){
    var off = seededOffset(card.id);
    var cardEl = buildCardEl(card, true);
    cardEl.style.transform = 'translate('+off.dx+'px,'+off.dy+'px) rotate('+off.rot+'deg)';
    cardEl.style.zIndex = String(i);
    if(i===cards.length-1 && !skipLandingAnim){ cardEl.classList.add('landing'); cardEl.style.setProperty('--land-rot', off.rot+'deg'); }
    wrap.appendChild(cardEl);
  });
}
function spawnCardBurst(color){
  var wrap = document.getElementById('discard-stack');
  if(!wrap) return;
  var colorHex = {red:'#ff6672', yellow:'#ffd85c', green:'#63dd93', blue:'#5cb2ff', wild:'#e0a0f0'}[color] || '#ffd85c';
  var ring = el('div','shock-ring');
  ring.style.setProperty('--ring-color', colorHex);
  wrap.appendChild(ring);
  setTimeout(function(){ if(ring.parentNode) ring.parentNode.removeChild(ring); }, 520);
  for(var i=0;i<16;i++){
    var p = el('div','burst-particle');
    var angle = (Math.PI*2*i/16) + Math.random()*0.3;
    var dist = 26+Math.random()*34;
    var size = 3+Math.random()*4;
    p.style.width = size+'px'; p.style.height = size+'px';
    p.style.background = colorHex;
    p.style.boxShadow = '0 0 8px '+colorHex;
    p.style.setProperty('--bx', Math.cos(angle)*dist+'px');
    p.style.setProperty('--by', Math.sin(angle)*dist+'px');
    p.style.animationDuration = (450+Math.random()*220)+'ms';
    wrap.appendChild(p);
    (function(node){ setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 700); })(p);
  }
}
function pulseDiscardImpact(){
  var wrap = document.getElementById('discard-stack');
  if(!wrap) return;
  var top = wrap.lastChild;
  if(top && top.classList) top.classList.add('impact');
}

/* ---------- flying card: generic FLIP-style clone animation used for both
   plays (hand/opponent → discard) and draws (deck → hand/opponent) ---------- */
function flyCard(fromRect, toRect, cardData, faceUp, opts){
  opts = opts || {};
  if(!fromRect || !toRect || !fromRect.width || !toRect.width){ opts.onDone && opts.onDone(); return; }
  try{
    var clone = buildCardEl(cardData, faceUp);
    clone.className = 'card flying-card' + (faceUp && cardData ? ' '+cardData.color : ' back');
    clone.style.width = fromRect.width+'px';
    clone.style.height = fromRect.height+'px';
    clone.style.left = fromRect.left+'px';
    clone.style.top = fromRect.top+'px';
    clone.style.margin = '0';
    document.body.appendChild(clone);
    var dx = toRect.left - fromRect.left, dy = toRect.top - fromRect.top;
    var scaleEnd = toRect.width / fromRect.width;
    var arcLift = -(50 + Math.random()*20);
    var midRot = (Math.random()*46-23);
    var duration = opts.duration || 420;
    var finished = false;
    function cleanup(){
      if(finished) return; finished = true;
      if(clone.parentNode) clone.parentNode.removeChild(clone);
      opts.onDone && opts.onDone();
    }
    if(clone.animate){
      var anim = clone.animate([
        { transform:'translate(0px,0px) rotate(0deg) scale(1)' },
        { transform:'translate('+(dx*0.5)+'px,'+(dy*0.5+arcLift)+'px) rotate('+midRot+'deg) scale('+Math.max(1,scaleEnd)+')' },
        { transform:'translate('+dx+'px,'+dy+'px) rotate(0deg) scale('+scaleEnd+')' }
      ], { duration:duration, easing:'cubic-bezier(.22,.7,.32,1)' });
      anim.onfinish = cleanup;
      anim.oncancel = cleanup;
    } else {
      clone.style.transition = 'transform '+duration+'ms cubic-bezier(.22,.7,.32,1)';
      requestAnimationFrame(function(){ clone.style.transform = 'translate('+dx+'px,'+dy+'px) scale('+scaleEnd+')'; });
      setTimeout(cleanup, duration);
    }
    setTimeout(cleanup, duration+300); // safety net
  }catch(e){ opts.onDone && opts.onDone(); }
}
function findPlayFlightOrigin(prev, view){
  if(!prev || !view || !view.discardTop) return null;
  if(prev.discardTop && prev.discardTop.id === view.discardTop.id) return null;
  var mineNode = document.querySelector('#hand-fan .card[data-card-id="'+view.discardTop.id+'"]');
  if(mineNode) return { rect: mineNode.getBoundingClientRect(), wasMine: true };
  var oppFanEl = document.getElementById('opp-fan');
  if(oppFanEl && oppFanEl.children.length) return { rect: oppFanEl.getBoundingClientRect(), wasMine: false };
  return null;
}
function spawnBonusDrawCascade(fromRect, toEl, count){
  if(!fromRect || !toEl || count<=0) return;
  for(var i=0;i<count;i++){
    (function(idx){
      setTimeout(function(){
        if(!toEl || !document.body.contains(toEl)) return;
        var toRect = toEl.getBoundingClientRect();
        flyCard(fromRect, toRect, null, false, { duration:380 });
      }, idx*140);
    })(i);
  }
}

function renderDrawPile(count, canDraw, pendingDraw){
  var wrap = document.getElementById('draw-pile');
  wrap.innerHTML='';
  var layers = Math.min(4, Math.max(1, Math.ceil(count/15)));
  for(var i=0;i<layers;i++){
    var c = buildCardEl(null,false);
    c.style.transform = 'translate('+(i*-1.5)+'px,'+(i*-1.5)+'px)';
    c.style.zIndex = String(i);
    if(!canDraw) c.classList.add('disabled');
    wrap.appendChild(c);
  }
  var countEl = document.getElementById('deck-count');
  var isUrgent = canDraw && pendingDraw>0;
  wrap.classList.toggle('urgent', isUrgent);
  if(isUrgent){ countEl.textContent = 'Draw '+pendingDraw+'!'; countEl.classList.add('urgent'); }
  else { countEl.textContent = count+' left'; countEl.classList.remove('urgent'); }
  if(count>0 && canDraw){
    wrap.style.cursor='pointer';
    wrap.onclick = function(){ var t=wrap.lastChild; if(t) t.classList.add('drawing'); requestDraw(); };
  } else { wrap.onclick=null; wrap.style.cursor='default'; }
}

function updateColorRing(color){
  var wrap = document.getElementById('discard-stack');
  wrap.querySelectorAll('.color-ring').forEach(function(r){r.remove();});
  wrap.appendChild(el('div','color-ring '+color));
  var tableCenter = document.querySelector('.table-center');
  if(tableCenter) tableCenter.setAttribute('data-color', color||'');
  var badge = document.getElementById('current-color-badge');
  if(badge && color){
    badge.className = 'current-color-badge '+color;
    document.getElementById('ccb-label').textContent = color.toUpperCase();
  }
}

function updateTurnBanner(isMyTurn, awaiting, pendingDraw, pendingDrawType){
  var b = document.getElementById('turn-banner');
  var textEl = document.getElementById('turn-banner-text');
  var stackLabel = pendingDrawType==='wild4' ? '+4' : '+2';
  if(isMyTurn){
    b.classList.add('mine');
    if(pendingDraw>0){ textEl.textContent = 'Stack a '+stackLabel+' or draw '+pendingDraw+'!'; }
    else { textEl.textContent = awaiting ? 'Play the card or pass' : 'Your Turn'; }
  } else {
    b.classList.remove('mine');
    if(pendingDraw>0){ textEl.textContent = (App.oppName||'Opponent')+' must answer +'+pendingDraw; }
    else { textEl.textContent = (App.oppName||'Opponent') + ' is playing…'; }
  }
}
var turnTimerDisplayHandle = null;
function startTurnTimerDisplay(){
  if(turnTimerDisplayHandle) return;
  turnTimerDisplayHandle = setInterval(function(){
    var view = App.lastView;
    var ring = document.getElementById('turn-timer-ring');
    var num = document.getElementById('turn-timer-num');
    if(!ring || !num) return;
    if(!view || view.winner || !view.turnStartedAt){ ring.style.setProperty('--pct', 100); ring.classList.remove('urgent'); num.textContent=''; return; }
    var totalSec = TURN_TIME_MS/1000;
    var elapsed = (Date.now() - view.turnStartedAt)/1000;
    var remaining = Math.max(0, Math.ceil(totalSec - elapsed));
    var pct = Math.max(0, Math.min(100, 100 - (elapsed/totalSec)*100));
    ring.style.setProperty('--pct', pct);
    ring.classList.toggle('urgent', remaining<=10);
    num.textContent = String(remaining);
  }, 250);
}
function setActiveRow(isMyTurn){
  document.getElementById('me-row').classList.toggle('active', isMyTurn);
  document.getElementById('opp-row').classList.toggle('active', !isMyTurn);
}
function renderAvatar(containerId, name){
  var container = document.getElementById(containerId);
  container.innerHTML='';
  var url = avatarUrlForName(name);
  if(url){ var img = el('img','avatar-img'); img.src=url; img.alt=name; container.appendChild(img); }
  else { var initial = el('div','avatar-initial'); initial.textContent = (name||'?').trim().charAt(0).toUpperCase(); container.appendChild(initial); }
}
function updateScoreboard(){
  document.getElementById('score-me-name').textContent = App.myName;
  document.getElementById('score-opp-name').textContent = App.oppName;
  document.getElementById('score-me-num').textContent = String(App.winTally[App.myName]||0);
  document.getElementById('score-opp-num').textContent = String(App.winTally[App.oppName]||0);
}

function playReactionsForTransition(prev, view, myRole, opts){
  opts = opts || {};
  if(!prev) return;
  var discardChanged = view.discardTop && prev.discardTop && view.discardTop.id !== prev.discardTop.id;
  if(discardChanged){ sfxCardPlay(); if(!opts.suppressBurst){ spawnCardBurst(view.discardTop.color); pulseDiscardImpact(); } }
  var myPrevCount = prev.myHand.length, myNowCount = view.myHand.length;
  var oppPrevCount = prev.oppCount, oppNowCount = view.oppCount;
  if(!discardChanged && (myNowCount>myPrevCount || oppNowCount>oppPrevCount)) sfxDraw();
  var wasMyTurn = prev.turn===myRole, isMyTurnNow = view.turn===myRole;
  if(!wasMyTurn && isMyTurnNow && !view.winner) sfxTurnChime();
  if(!prev.winner && view.winner) (view.winner===myRole) ? sfxWin() : sfxLose();
}

function renderCommon(view, myRole){
  var prev = App.lastView;
  document.getElementById('me-name').textContent = App.myName;
  document.getElementById('opp-name').textContent = App.oppName;
  renderAvatar('me-avatar', App.myName);
  renderAvatar('opp-avatar', App.oppName);
  updateScoreboard();

  var isMyTurn = view.turn === myRole;
  setActiveRow(isMyTurn);
  updateTurnBanner(isMyTurn, view.awaitingPlayOrPass, view.pendingDraw||0, view.pendingDrawType);

  var playFlightOrigin = findPlayFlightOrigin(prev, view);
  var playFlightRect = playFlightOrigin ? playFlightOrigin.rect : null;
  var discardChangedNow = !!(prev && view.discardTop && prev.discardTop && view.discardTop.id !== prev.discardTop.id);

  renderDiscard(view.discardCards || (view.discardTop?[view.discardTop]:[]), !!playFlightOrigin);
  var discardWrap = document.getElementById('discard-stack');
  var topDiscardNode = discardWrap ? discardWrap.lastElementChild : null;
  var discardTargetRect = topDiscardNode ? topDiscardNode.getBoundingClientRect() : null;
  if(playFlightOrigin && topDiscardNode){ topDiscardNode.style.visibility = 'hidden'; }
  updateColorRing(view.currentColor);
  renderDrawPile(view.deckCount, isMyTurn && !view.awaitingPlayOrPass, view.pendingDraw||0);

  playReactionsForTransition(prev, view, myRole, { suppressBurst: !!playFlightOrigin });
  App.lastView = view;

  // draw-flight eligibility — only for a "pure" draw, not a play (stacking means +2/+4
  // no longer moves cards at play-time; the real transfer happens when someone actually
  // draws to accept a pending stack, possibly several cards at once)
  var wantDrawFlight = false, drawFlightMine = false, drawFlightCount = 0;
  if(prev && !discardChangedNow){
    if(typeof App.lastMyHandLen==='number' && view.myHand.length > App.lastMyHandLen){
      wantDrawFlight = true; drawFlightMine = true; drawFlightCount = view.myHand.length - App.lastMyHandLen;
    } else if(view.oppCount > prev.oppCount){
      wantDrawFlight = true; drawFlightMine = false; drawFlightCount = view.oppCount - prev.oppCount;
    }
  }
  var drawPileRect = null;
  if(wantDrawFlight){ var dp = document.getElementById('draw-pile'); if(dp) drawPileRect = dp.getBoundingClientRect(); }
  App.lastMyHandLen = view.myHand.length;

  var oppFan = document.getElementById('opp-fan');
  var oppCards=[]; for(var i=0;i<view.oppCount;i++) oppCards.push({id:'o'+i});
  layoutFan(oppFan, oppCards, false, {});

  var handFan = document.getElementById('hand-fan');
  var canInteract = isMyTurn;
  layoutFan(handFan, view.myHand, true, {
    playableCheck:function(card){
      if(!canInteract) return false;
      if(view.pendingDraw>0){ return card.type===view.pendingDrawType; }
      if(view.awaitingPlayOrPass) return card.id===view.lastDrawnId;
      var top = view.discardTop;
      if(!isPlayable(card, top, view.currentColor)) return false;
      if(card.type==='wild4' && !canPlayWild4(view.myHand, view.currentColor)) return false;
      return true;
    },
    onClick:function(card){ onHandCardClick(card); }
  });

  var passBtn = document.getElementById('pass-btn');
  passBtn.classList.toggle('hidden', !(isMyTurn && view.awaitingPlayOrPass));
  passBtn.onclick = function(){ sfxClick(); requestPass(); };

  var unoBtn = document.getElementById('uno-btn');
  unoBtn.classList.toggle('hidden', view.myHand.length!==1);
  unoBtn.onclick = function(){ sfxUno(); showUnoCallout(App.myName); requestUno(); };

  /* ---- fire flight animations now that both the old and new DOM states are known ---- */
  if(playFlightOrigin && discardTargetRect){
    flyCard(playFlightRect, discardTargetRect, view.discardTop, true, { duration:420, onDone:function(){
      if(topDiscardNode) topDiscardNode.style.visibility = '';
      spawnCardBurst(view.discardTop.color);
      pulseDiscardImpact();
    }});
  }
  if(wantDrawFlight && drawPileRect){
    if(drawFlightCount===1 && drawFlightMine && view.lastDrawnId!==null && view.lastDrawnId!==undefined){
      var destNode = document.querySelector('#hand-fan .card[data-card-id="'+view.lastDrawnId+'"]');
      var drawnCardData = null;
      for(var k=0;k<view.myHand.length;k++){ if(view.myHand[k].id===view.lastDrawnId){ drawnCardData=view.myHand[k]; break; } }
      if(destNode && drawnCardData){
        var toRect = destNode.getBoundingClientRect();
        destNode.style.visibility = 'hidden';
        flyCard(drawPileRect, toRect, drawnCardData, true, { duration:360, onDone:function(){
          destNode.style.visibility = '';
        }});
      }
    } else if(drawFlightMine){
      // multiple cards accepted at once (a stack penalty) — cascade them face-down into my own fan
      var handFanEl = document.getElementById('hand-fan');
      if(handFanEl) spawnBonusDrawCascade(drawPileRect, handFanEl, drawFlightCount);
    } else {
      var oppFanEl2 = document.getElementById('opp-fan');
      if(oppFanEl2 && oppFanEl2.children.length){
        spawnBonusDrawCascade(drawPileRect, oppFanEl2, drawFlightCount);
      }
    }
  }
}

var __lastUnoCalloutAt = 0, __lastUnoCalloutName = '';
function showUnoCallout(name){
  var now = Date.now();
  if(name===__lastUnoCalloutName && (now-__lastUnoCalloutAt) < 700) return; // debounce: avoids a double-flash when the local optimistic call and the network echo land close together
  __lastUnoCalloutAt = now; __lastUnoCalloutName = name;
  var overlay = document.getElementById('uno-callout');
  if(!overlay) return;
  document.getElementById('uno-callout-who').textContent = (name||'Someone') + ' calls';
  overlay.classList.remove('show'); void overlay.offsetWidth; overlay.classList.add('show');
  clearTimeout(overlay.__hideTimer);
  overlay.__hideTimer = setTimeout(function(){ overlay.classList.remove('show'); }, 1550);
}

function spawnConfetti(container, celebratory){
  container.querySelectorAll('.confetti').forEach(function(o){o.remove();});
  if(!celebratory) return;
  var colorVals = {red:'var(--red-light)', yellow:'var(--amber-light)', green:'var(--green-light)', blue:'var(--blue-light)', pink:'var(--pink)'};
  var keys = Object.keys(colorVals);
  for(var i=0;i<100;i++){
    var isRibbon = Math.random()<0.35;
    var pc = el('div','confetti '+(isRibbon?'shape-ribbon':'shape-circle'));
    pc.style.left = Math.random()*100+'%';
    pc.style.background = colorVals[keys[i%keys.length]];
    pc.style.animationDuration = (2.4+Math.random()*1.8)+'s';
    pc.style.animationDelay = (Math.random()*0.8)+'s';
    container.appendChild(pc);
    (function(node){ setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 5200); })(pc);
  }
}
function spawnFireworks(container){
  var colorVals = ['#ff6672','#ffd85c','#63dd93','#5cb2ff','#e0a0f0'];
  function burstAt(xPct, yPct){
    var color = colorVals[Math.floor(Math.random()*colorVals.length)];
    for(var i=0;i<22;i++){
      var p = el('div','firework-particle');
      var angle = Math.PI*2*i/22 + Math.random()*0.2;
      var dist = 60+Math.random()*90;
      p.style.left = xPct+'%'; p.style.top = yPct+'%';
      p.style.background = color;
      p.style.boxShadow = '0 0 8px '+color;
      p.style.setProperty('--fx', Math.cos(angle)*dist+'px');
      p.style.setProperty('--fy', Math.sin(angle)*dist+'px');
      container.appendChild(p);
      (function(node){ setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 950); })(p);
    }
  }
  var bursts = [[20,30],[80,25],[50,18],[35,45],[65,42]];
  bursts.forEach(function(pos, i){
    setTimeout(function(){ burstAt(pos[0], pos[1]); }, i*380);
  });
  // gentle recurring sparkle while the win screen stays open
  var loopTimer = setInterval(function(){
    if(document.getElementById('win-screen').classList.contains('hidden')){ clearInterval(loopTimer); return; }
    burstAt(15+Math.random()*70, 15+Math.random()*35);
  }, 1900);
}

function formatTime(){
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h>=12 ? 'PM' : 'AM';
  h = h%12; if(h===0) h=12;
  return h+':'+(m<10?'0':'')+m+' '+ampm;
}
function isEmojiOnly(text){
  var stripped = text.replace(/\s/g,'');
  if(!stripped) return false;
  try{ return /^[\p{Extended_Pictographic}\u{FE0F}\u{200D}\u{1F3FB}-\u{1F3FF}]+$/u.test(stripped); }
  catch(e){ return false; }
}
function appendChatMessage(from, text, isMe){
  var list = document.getElementById('chat-messages');
  var emojiOnly = isEmojiOnly(text);
  var row = el('div', 'chat-msg'+(isMe?' me':'')+(emojiOnly?' emoji-only':''));
  var author = el('div','chat-author'); author.textContent = from;
  var bubble = el('div','chat-bubble'); bubble.textContent = text;
  var time = el('div','chat-time'); time.textContent = formatTime();
  row.appendChild(author); row.appendChild(bubble); row.appendChild(time);
  list.appendChild(row);
  list.scrollTop = list.scrollHeight;
}

function seededAnimClass(item){
  var sum = 0; for(var i=0;i<item.length;i++) sum += item.charCodeAt(i);
  return 'sticker-anim-'+(sum%4);
}
function debounce(fn, wait){
  var t;
  return function(){
    var args = arguments;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(null, args); }, wait);
  };
}

      '<input type="text" id="gif-search-input" class="gif-search" placeholder="Search GIFs…">'+

      '<div class="picker-grid gif-grid" id="gif-results-grid"></div>';

      var q = document.getElementById('gif-search-input').value.trim();

    container.innerHTML =
      '<div class="gif-key-hint">Real GIF search needs a free Giphy key — get one at '+

  var url = 'https://api.giphy.com/v1/gifs/trending?api_key='+encodeURIComponent(CONFIG.giphyApiKey)+'&limit=20&rating=pg-13';
  fetch(url).then(function(r){ return r.json(); }).then(function(data){ renderGifResults(data.data||[]); }).catch(function(){ showGifFetchError(); });

function fetchGiphySearch(query){
  var url = 'https://api.giphy.com/v1/gifs/search?api_key='+encodeURIComponent(CONFIG.giphyApiKey)+'&q='+encodeURIComponent(query)+'&limit=20&rating=pg-13';

function buildParticles(){

    sfxClick(); getAudioCtx();
    var name = document.getElementById('autojoin-name-input').value.trim();
    if(!name){ return showFieldError('autojoin-error','Enter your name first.'); }
    App.myName = name;
    startJoining(window.__autoJoinCode);
  });
  document.getElementById('copy-link-btn').addEventListener('click', function(){
    sfxClick();
    var input = document.getElementById('share-link-input');
    input.select(); input.setSelectionRange(0,999);
    navigator.clipboard && navigator.clipboard.writeText(input.value).catch(function(){});
    try{ document.execCommand('copy'); }catch(e){}
    var btn = document.getElementById('copy-link-btn');
    var old = btn.textContent; btn.textContent='Copied!';
    setTimeout(function(){ btn.textContent = old; }, 1400);
  });
  document.getElementById('play-again-btn').addEventListener('click', function(){
    sfxClick();
    document.getElementById('win-screen').classList.add('hidden');
    if(App.role==='host'){ beginGame(); }
    else { showToast('Waiting for '+App.oppName+' to start a new round…'); }
  });

  document.getElementById('mute-btn').addEventListener('click', toggleMute);
  document.getElementById('reconnect-btn').addEventListener('click', function(){ sfxClick(); attemptReconnect(); });
  document.getElementById('chat-send-btn').addEventListener('click', sendChat);
  document.getElementById('chat-input').addEventListener('keydown', function(ev){ if(ev.key==='Enter') sendChat(); });

  renderEmojiPicker();
  document.getElementById('reaction-toggle-btn').addEventListener('click', function(ev){
    ev.stopPropagation();
    var picker = document.getElementById('reaction-picker');
    picker.classList.toggle('hidden');
  });
  document.getElementById('picker-close-btn').addEventListener('click', function(ev){ ev.stopPropagation(); closeAllPickers(); });
  document.getElementById('tab-btn-emoji').addEventListener('click', function(ev){ ev.stopPropagation(); switchPickerTab('emoji'); });
  document.getElementById('tab-btn-gif').addEventListener('click', function(ev){ ev.stopPropagation(); switchPickerTab('gif'); });
  document.getElementById('reaction-picker').addEventListener('click', function(ev){ ev.stopPropagation(); });
  document.addEventListener('click', closeAllPickers);

  var params = new URLSearchParams(location.search);
  var roomParam = params.get('room');
  if(roomParam){ window.__autoJoinCode = roomParam; }

  function revealLobby(){
    if(window.__autoJoinCode){
      document.getElementById('autojoin-code-badge').textContent = 'Room '+window.__autoJoinCode.toUpperCase();
      hide('lobby-start');
      show('lobby-autojoin-panel');
    }
    show('lobby-screen');
  }

  if(CONFIG.accessPassword){
    buildHeroFan('password-hero-fan');
    show('password-screen');
    function checkPassword(){
      var val = document.getElementById('password-input').value;
      if(val === CONFIG.accessPassword){
        hide('password-screen');
        revealLobby();
      } else {
        showFieldError('password-error', 'Wrong password — try again.');
        document.getElementById('password-input').value='';
        document.getElementById('password-input').focus();
      }
    }
    document.getElementById('password-submit-btn').addEventListener('click', checkPassword);
    document.getElementById('password-input').addEventListener('keydown', function(ev){ if(ev.key==='Enter') checkPassword(); });
  } else {
    revealLobby();
  }
});

})();
</script>
</body>
</html>
