<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNO — Play with a Friend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
  :root{
    --ink:#120e1f;
    --cream:#f5f1ea;
    --cream-dim:#b9b3c9;
    --amber:#f4b400;
    --amber-light:#ffd966;
    --red:#e31b23;
    --red-light:#ff5c6c;
    --green:#1f8a46;
    --green-light:#5fcb82;
    --blue:#0a66b3;
    --blue-light:#4fa3e3;
    --panel-glass: rgba(255,255,255,.055);
    --panel-glass-strong: rgba(255,255,255,.09);
    --panel-border: rgba(255,255,255,.14);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh; min-height:100dvh;
    font-family:'Nunito Sans', sans-serif;
    color:var(--cream);
    background:radial-gradient(ellipse 1500px 950px at 50% 38%, #1c1442 0%, #100c28 55%, #050409 100%);
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3{font-family:'Lilita One', cursive; font-weight:400; letter-spacing:.5px; margin:0;}
  button{font-family:inherit;}
  ::selection{background:var(--amber); color:var(--ink);}
  :focus-visible{outline:3px solid var(--amber-light); outline-offset:3px; border-radius:6px;}
  .hidden{display:none !important;}

  /* ---------- ambient background orbs (signature: UNO's 4 colors as living light) ---------- */
  .ambient-orbs{position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
  .orb{position:absolute; border-radius:50%; filter:blur(75px);}
  .orb-red{width:400px; height:400px; background:var(--red); opacity:.28; top:-100px; left:-110px; animation:floatA 15s ease-in-out infinite;}
  .orb-yellow{width:440px; height:440px; background:var(--amber); opacity:.22; top:-110px; right:-130px; animation:floatB 18s ease-in-out infinite;}
  .orb-green{width:420px; height:420px; background:var(--green); opacity:.24; bottom:-130px; left:-90px; animation:floatC 17s ease-in-out infinite;}
  .orb-blue{width:440px; height:440px; background:var(--blue); opacity:.26; bottom:-110px; right:-100px; animation:floatA 20s ease-in-out infinite reverse;}
  @keyframes floatA{0%,100%{transform:translate(0,0);}50%{transform:translate(34px,22px);}}
  @keyframes floatB{0%,100%{transform:translate(0,0);}50%{transform:translate(-28px,26px);}}
  @keyframes floatC{0%,100%{transform:translate(0,0);}50%{transform:translate(22px,-26px);}}

  .screen{
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 16px; position:relative; z-index:1;
  }

  /* ---------- glass panels ---------- */
  .glass{
    background:var(--panel-glass); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    border:1px solid var(--panel-border); border-radius:var(--radius);
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }

  /* ---------- Buttons ---------- */
  .btn{border:none; cursor:pointer; border-radius:999px; padding:14px 30px; font-size:1.05rem; font-weight:800;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s;
    box-shadow:0 4px 0 rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.35);}
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.35);}
  .btn-primary{background:linear-gradient(135deg, var(--amber-light), var(--amber) 70%, #e0930a); color:var(--ink);}
  .btn-secondary{background:transparent; color:var(--cream); border:2px solid rgba(255,255,255,.28); box-shadow:none; padding:12px 28px;}
  .btn-secondary:hover{border-color:var(--cream); background:rgba(255,255,255,.06);}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
  .btn-sm{padding:8px 18px; font-size:.85rem;}

  input[type=text]{font-family:inherit; font-size:1rem; padding:12px 16px; border-radius:10px;
    border:1.5px solid rgba(255,255,255,.18); background:rgba(0,0,0,.28); color:var(--cream); width:100%;}
  input[type=text]::placeholder{color:var(--cream-dim);}
  input[type=text]:focus{border-color:var(--amber); outline:none;}
  label{font-size:.8rem; color:var(--cream-dim); font-weight:700; text-transform:uppercase; letter-spacing:.06em;}

  .icon-btn{width:42px; height:42px; border-radius:50%; background:var(--panel-glass-strong); border:1px solid var(--panel-border);
    color:var(--cream); font-size:1.05rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
    position:relative; transition:transform .15s; backdrop-filter:blur(10px);}
  .icon-btn:hover{transform:scale(1.08);}

  /* ---------- Lobby ---------- */
  #lobby-screen .lobby-inner{max-width:460px; width:100%;}
  .lobby-card{padding:34px 30px; text-align:center; animation:lobbyIn .55s cubic-bezier(.16,1,.3,1);}
  @keyframes lobbyIn{from{opacity:0; transform:translateY(22px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);}}
  .hero-fan{position:relative; height:150px; margin-bottom:4px;}
  @keyframes idleFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
  .hero-fan .card{animation:idleFloat 2.8s ease-in-out infinite;}
  .hero-fan .hand-slot:nth-child(1) .card{animation-delay:0s;}
  .hero-fan .hand-slot:nth-child(2) .card{animation-delay:.25s;}
  .hero-fan .hand-slot:nth-child(3) .card{animation-delay:.5s;}
  .hero-fan .hand-slot:nth-child(4) .card{animation-delay:.75s;}
  .hero-fan .hand-slot:nth-child(5) .card{animation-delay:1s;}
  #lobby-title{font-size:3.6rem; color:var(--amber-light); text-shadow:0 4px 0 rgba(0,0,0,.4), 0 0 44px rgba(244,180,0,.4); margin-bottom:4px;}
  #lobby-tagline{color:var(--cream-dim); margin-bottom:26px; font-weight:600;}
  .lobby-field{margin-bottom:18px; text-align:left;}
  .lobby-field label{display:block; margin-bottom:6px;}
  .lobby-choice-row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .lobby-panel{background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:20px; margin-top:16px; text-align:left;}
  .share-row{display:flex; gap:8px; margin-top:10px;}
  .share-row input{font-weight:700; letter-spacing:.03em;}
  .waiting-line{display:flex; align-items:center; gap:10px; margin-top:14px; color:var(--cream-dim); font-weight:700;}
  .spinner{width:16px; height:16px; border-radius:50%; border:3px solid rgba(255,255,255,.25); border-top-color:var(--amber); animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .lobby-back{margin-top:16px; background:none; border:none; color:var(--cream-dim); text-decoration:underline; cursor:pointer; font-weight:700;}
  .join-code-badge{display:inline-block; background:rgba(244,180,0,.15); border:1px solid var(--amber); color:var(--amber-light);
    padding:4px 12px; border-radius:8px; font-weight:800; letter-spacing:.08em; margin-bottom:16px;}
  .error-text{color:var(--red-light); font-weight:700; font-size:.9rem; margin-top:10px; min-height:1.2em;}

  /* ---------- Avatars ---------- */
  .avatar{width:38px; height:38px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:var(--panel-glass-strong); border:2px solid rgba(255,255,255,.22); flex-shrink:0; transition:all .3s;}
  .avatar-img{width:100%; height:100%; object-fit:cover; display:block;}
  .avatar-initial{font-family:'Lilita One',cursive; font-size:1.05rem; color:var(--cream);}
  .player-row.active .avatar{border-color:var(--amber); box-shadow:0 0 0 3px rgba(244,180,0,.32), 0 0 16px rgba(244,180,0,.5);}

  /* ---------- Game top bar ---------- */
  .game-topbar{position:fixed; top:0; left:0; right:0; height:58px; display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; z-index:40; background:linear-gradient(180deg, rgba(8,6,18,.6), transparent);}
  .topbar-brand{font-family:'Lilita One',cursive; font-size:1.25rem; color:var(--amber-light); letter-spacing:.05em; text-shadow:0 0 18px rgba(244,180,0,.35);}
  .topbar-actions{display:flex; gap:10px;}

  /* ---------- Game screen layout ---------- */
  .game-screen-wrap{display:flex; flex-direction:row; align-items:stretch; min-height:100vh; min-height:100dvh; width:100%; position:relative; z-index:1;}
  .game-main{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; padding:70px 14px 14px; position:relative;}
  .game-main::before{content:''; position:absolute; top:0; left:0; right:0; height:100%;
    background:radial-gradient(ellipse 620px 520px at 50% 42%, rgba(255,255,255,.055), transparent 68%);
    pointer-events:none; z-index:0;}
  .board{width:100%; max-width:680px; display:flex; flex-direction:column; height:100%; align-items:center; position:relative; z-index:1;}
  .player-row{width:100%; display:flex; flex-direction:column; align-items:center; padding:8px 0;}
  .player-label{display:flex; align-items:center; gap:10px; font-weight:800; color:var(--cream-dim); margin-bottom:8px; font-size:.95rem;}
  .player-row.active .player-label{color:var(--amber-light);}
  .opp-fan, .hand-fan{position:relative; height:120px; width:100%; max-width:560px;}
  .hand-fan{height:150px;}

  .table-center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; width:100%; padding:6px 0; min-height:170px;}
  .piles-row{display:flex; align-items:center; gap:36px;}
  .pile-wrap{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .pile-label{font-size:.72rem; color:var(--cream-dim); font-weight:700; text-transform:uppercase; letter-spacing:.08em;}
  #draw-pile{position:relative; width:80px; height:114px; cursor:pointer;}
  #draw-pile .card{position:absolute; top:0; left:0;}
  #discard-stack{position:relative; width:80px; height:114px;}
  #discard-stack .card{position:absolute; top:0; left:0;}
  .deck-count{font-size:.75rem; font-weight:800; color:var(--cream-dim);}

  .turn-banner{font-family:'Lilita One', cursive; font-size:1.25rem; letter-spacing:.03em; padding:8px 22px; border-radius:999px;
    background:var(--panel-glass-strong); border:1px solid var(--panel-border); color:var(--cream-dim); text-align:center; transition:all .25s ease;
    backdrop-filter:blur(10px);}
  .turn-banner.mine{color:var(--ink); background:linear-gradient(135deg, var(--amber-light), var(--amber)); box-shadow:0 0 26px rgba(244,180,0,.55); animation:pulseGlow 1.6s ease-in-out infinite;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 18px rgba(244,180,0,.4);}50%{box-shadow:0 0 32px rgba(244,180,0,.75);}}

  .color-ring{position:absolute; inset:-8px; border-radius:18px; border:4px solid transparent; pointer-events:none; transition:border-color .3s;}
  .color-ring.red{border-color:var(--red);} .color-ring.yellow{border-color:var(--amber);}
  .color-ring.green{border-color:var(--green);} .color-ring.blue{border-color:var(--blue);}

  .hand-actions{display:flex; gap:10px; align-items:center; margin-top:10px; min-height:44px;}
  #uno-btn{background:linear-gradient(135deg, var(--red-light), var(--red)); color:#fff; font-family:'Lilita One',cursive;
    font-size:1.1rem; padding:10px 22px; border-radius:999px; border:none; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 20px rgba(227,27,35,.4); animation:unoPulse 1s ease-in-out infinite;}
  @keyframes unoPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

  /* ---------- Cards (authentic UNO badge treatment) ---------- */
  .card{width:80px; height:114px; border-radius:11px; border:3px solid rgba(255,255,255,.9); position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden; user-select:none; -webkit-user-select:none;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s; flex-shrink:0;}
  .card::before{content:''; position:absolute; top:-45%; left:-25%; width:55%; height:190%;
    background:linear-gradient(115deg, rgba(255,255,255,.32), rgba(255,255,255,0) 65%); transform:rotate(12deg); pointer-events:none; z-index:3;}
  .card .badge{flex-shrink:0; width:68%; height:48%; background:var(--cream); border-radius:50%;
    transform:rotate(-18deg); display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,.35), inset 0 0 0 2px rgba(0,0,0,.07); z-index:1;}
  .card .center-symbol{position:relative; z-index:2; font-family:'Lilita One', cursive; font-size:1.85rem; line-height:1;
    color:var(--sym-color); -webkit-text-stroke:1.3px rgba(0,0,0,.5);}
  .card .corner{position:absolute; font-family:'Lilita One',cursive; font-size:.72rem; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4); z-index:2;}
  .card .corner.tl{top:6px; left:7px;} .card .corner.br{bottom:6px; right:7px; transform:rotate(180deg);}
  .card.red{background:linear-gradient(150deg,var(--red-light),var(--red) 65%); --sym-color:#c4121c;
    box-shadow:0 4px 10px rgba(0,0,0,.4), 0 8px 22px rgba(227,27,35,.35);}
  .card.yellow{background:linear-gradient(150deg,#ffe066,#f2b300 65%); --sym-color:#a5710a;
    box-shadow:0 4px 10px rgba(0,0,0,.4), 0 8px 22px rgba(242,179,0,.35);}
  .card.green{background:linear-gradient(150deg,var(--green-light),var(--green) 65%); --sym-color:#136b34;
    box-shadow:0 4px 10px rgba(0,0,0,.4), 0 8px 22px rgba(31,138,70,.35);}
  .card.blue{background:linear-gradient(150deg,var(--blue-light),var(--blue) 65%); --sym-color:#084a82;
    box-shadow:0 4px 10px rgba(0,0,0,.4), 0 8px 22px rgba(10,102,179,.35);}
  .card.wild{background:conic-gradient(from 45deg, var(--red), var(--amber), var(--green), var(--blue), var(--red)); --sym-color:#241a3d;
    box-shadow:0 4px 10px rgba(0,0,0,.4), 0 8px 22px rgba(150,100,220,.3);}
  .card.yellow .corner{color:#5c3d00; text-shadow:0 1px 1px rgba(255,255,255,.35);}
  .card.wild .corner{color:#241a3d; text-shadow:0 1px 1px rgba(255,255,255,.3);}
  .card.back{background:linear-gradient(160deg,#211546,#0a0620 82%); border-color:rgba(255,255,255,.55);}
  .card.back .crest{width:56%; height:56%; border-radius:50%;
    background:conic-gradient(from 0deg, var(--red) 0 25%, var(--amber) 25% 50%, var(--green) 50% 75%, var(--blue) 75% 100%);
    border:3px solid rgba(255,255,255,.85); box-shadow:0 2px 10px rgba(0,0,0,.4), 0 0 18px rgba(244,180,0,.3); z-index:1;
    animation:crestSpin 9s linear infinite;}
  @keyframes crestSpin{to{transform:rotate(360deg);}}
  .card.disabled{filter:saturate(.45) brightness(.7); cursor:default;}
  .card.playable{cursor:pointer;}
  .hand-slot{position:absolute; bottom:0; left:50%; transition:transform .3s ease; transform-origin:bottom center;}
  .hand-slot .card.playable:hover{transform:translateY(-24px) scale(1.08); box-shadow:0 16px 26px rgba(0,0,0,.5);}
  .hand-slot .card.playable:focus-visible{transform:translateY(-24px) scale(1.08);}

  @keyframes cardLand{0%{transform:scale(1.4) rotate(var(--land-rot,0deg)); opacity:.4;}60%{transform:scale(.94) rotate(var(--land-rot,0deg));}100%{transform:scale(1) rotate(var(--land-rot,0deg));}}
  .card.landing{animation:cardLand .32s cubic-bezier(.34,1.56,.64,1);}
  @keyframes drawPop{0%{transform:translateY(0) scale(1);}40%{transform:translateY(-16px) scale(1.06);}100%{transform:translateY(0) scale(1);}}
  .card.drawing{animation:drawPop .35s ease;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(6,4,14,.72); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-card{padding:28px; text-align:center; animation:modalIn .22s cubic-bezier(.34,1.56,.64,1);}
  @keyframes modalIn{from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;}}
  .modal-card h3{margin-bottom:18px; font-size:1.4rem; color:var(--cream);}
  .color-choices{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .swatch{width:84px; height:84px; border-radius:16px; border:3px solid rgba(255,255,255,.5); cursor:pointer; transition:transform .15s;}
  .swatch:hover{transform:scale(1.08);}
  .swatch.red{background:var(--red);} .swatch.yellow{background:var(--amber);}
  .swatch.green{background:var(--green);} .swatch.blue{background:var(--blue);}

  /* ---------- Toasts ---------- */
  #toast-container{position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{background:rgba(16,12,30,.92); border:1px solid rgba(255,255,255,.15); color:var(--cream); padding:10px 20px; border-radius:999px;
    font-weight:700; font-size:.9rem; box-shadow:0 8px 20px rgba(0,0,0,.4); animation:toastIn .25s ease;}
  @keyframes toastIn{from{opacity:0; transform:translateY(-14px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Chat panel ---------- */
  .chat-panel{position:relative; flex-shrink:0; height:100vh; height:100dvh; width:300px; display:flex; flex-direction:column;
    background:rgba(14,10,28,.82); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-left:1px solid var(--panel-border); z-index:2;}
  .chat-header{display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid rgba(255,255,255,.1);
    font-family:'Lilita One',cursive; font-size:1.1rem; color:var(--amber-light);}
  .chat-messages{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px;}
  .chat-msg{max-width:82%; display:flex; flex-direction:column;}
  .chat-msg.me{align-self:flex-end; align-items:flex-end;}
  .chat-msg.system{align-self:center; max-width:95%;}
  .chat-author{font-size:.68rem; color:var(--cream-dim); margin-bottom:2px; font-weight:700;}
  .chat-bubble{background:rgba(255,255,255,.08); padding:8px 13px; border-radius:14px; font-size:.88rem; word-break:break-word; line-height:1.35;}
  .chat-msg.me .chat-bubble{background:linear-gradient(135deg, var(--amber-light), var(--amber)); color:var(--ink);}
  .chat-msg.system .chat-bubble{background:transparent; color:var(--cream-dim); font-size:.78rem; font-style:italic; text-align:center;}
  .chat-input-row{display:flex; gap:8px; padding:12px; border-top:1px solid rgba(255,255,255,.1);}
  .chat-input-row input{flex:1;}

  /* ---------- Win screen ---------- */
  #win-screen{position:fixed; inset:0; z-index:70; background:rgba(5,4,10,.86); display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; overflow:hidden;}
  #win-title{font-size:3.2rem; margin-bottom:10px; animation:modalIn .3s cubic-bezier(.34,1.56,.64,1);}
  #win-title.won{color:var(--amber-light); text-shadow:0 0 44px rgba(244,180,0,.65);}
  #win-title.lost{color:var(--cream-dim);}
  .confetti{position:absolute; top:-20px; width:9px; height:14px; opacity:.9; animation:fall 3s linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(600deg); opacity:0;}}

  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}}

  @media (max-width:820px){
    .game-screen-wrap{flex-direction:column;}
    .chat-panel{width:100%; height:230px; border-left:none; border-top:1px solid var(--panel-border);}
    .game-main{padding:64px 10px 4px;}
  }

  @media (max-width:520px){
    .card{width:56px; height:80px; border-width:2px;}
    .card .center-symbol{font-size:1.3rem;}
    .card .corner{font-size:.56rem;}
    #draw-pile,#discard-stack{width:56px; height:80px;}
    #lobby-title{font-size:2.5rem;}
    .piles-row{gap:20px;}
    .opp-fan,.hand-fan{height:100px;}
    .hand-fan{height:118px;}
    .chat-panel{height:190px;}
    .lobby-card{padding:26px 18px;}
  }
</style>
</head>
<body>

<div class="ambient-orbs" aria-hidden="true">
  <div class="orb orb-red"></div><div class="orb orb-yellow"></div><div class="orb orb-green"></div><div class="orb orb-blue"></div>
</div>

<div id="toast-container"></div>

<!-- LOBBY -->
<div id="lobby-screen" class="screen">
  <div class="lobby-inner">
    <div class="lobby-card glass">
      <div class="hero-fan" id="hero-fan"></div>
      <h1 id="lobby-title">UNO</h1>
      <p id="lobby-tagline">Real-time, peer-to-peer. Just you, a link, and a friend.</p>

      <div id="lobby-start">
        <div class="lobby-field">
          <label for="name-input">Your name</label>
          <input type="text" id="name-input" maxlength="16" placeholder="e.g. Coc">
        </div>
        <div class="lobby-choice-row" id="lobby-choice-buttons">
          <button class="btn btn-primary" id="create-btn">Create Game</button>
          <button class="btn btn-secondary" id="show-join-btn">Join with a Code</button>
        </div>
        <div id="lobby-join-panel" class="lobby-panel hidden">
          <div class="lobby-field">
            <label for="join-code-input">Room code or link</label>
            <input type="text" id="join-code-input" placeholder="Paste code or link here">
          </div>
          <button class="btn btn-primary" id="join-submit-btn" style="width:100%;">Connect</button>

<script>
(function(){
"use strict";

/* ============================================================================
   ⚙️  EASY CONFIG — edit anytime, no coding needed
   - defaultMyName / defaultFriendName pre-fill the name boxes.
   - To use real photos: paste a direct image link (ends in .jpg/.png/.webp)
     between the quotes for myAvatarUrl / friendAvatarUrl.
     Leave as '' to keep the auto-generated initial avatar.
   ============================================================================ */
var CONFIG = {
  defaultMyName: 'Raj',
  defaultFriendName: 'Zoya',
  myAvatarUrl: '',      // e.g. 'https://i.imgur.com/yourphoto.jpg'
  friendAvatarUrl: ''   // e.g. 'https://i.imgur.com/herphoto.jpg'
};

var COLORS = ['red','yellow','green','blue'];

/* ============================================================================
   VERIFIED GAME ENGINE — simulation-tested (400 bot games), unchanged
   ============================================================================ */
function createDeck(){
  var deck = [], uid = 0;
  COLORS.forEach(function(color){
    deck.push({id:uid++, color:color, type:'number', value:0});
    for(var n=1;n<=9;n++){
      deck.push({id:uid++, color:color, type:'number', value:n});
      deck.push({id:uid++, color:color, type:'number', value:n});
    }
    for(var i=0;i<2;i++){
      deck.push({id:uid++, color:color, type:'skip'});
      deck.push({id:uid++, color:color, type:'reverse'});
      deck.push({id:uid++, color:color, type:'draw2'});
    }
  });
  for(var w=0; w<4; w++){
    deck.push({id:uid++, color:'wild', type:'wild'});
    deck.push({id:uid++, color:'wild', type:'wild4'});
  }
  return deck;
}

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  }
  return arr;
}

function other(p){ return p==='host' ? 'guest' : 'host'; }

function cardSymbol(card){
  if(card.type==='number') return String(card.value);
  if(card.type==='skip') return '⊘';
  if(card.type==='reverse') return '⇄';
  if(card.type==='draw2') return '+2';
  if(card.type==='wild') return '★';
  if(card.type==='wild4') return '+4';
  return '?';
}

function isPlayable(card, discardTop, currentColor){
  if(card.color==='wild') return true;
  if(card.color===currentColor) return true;
  if(card.type==='number' && discardTop.type==='number' && card.value===discardTop.value) return true;
  if(card.type!=='number' && card.type===discardTop.type) return true;
  return false;
}

function canPlayWild4(hand, currentColor){
  return !hand.some(function(c){ return c.color===currentColor; });
}

function getEffect(card){
  switch(card.type){
    case 'skip': case 'reverse': return {skip:true, draw:0};
    case 'draw2': return {skip:true, draw:2};
    case 'wild4': return {skip:true, draw:4};
    default: return {skip:false, draw:0};
  }
}

/* ============================================================================
   App state, avatars, room codes
   ============================================================================ */
var App = {
  peer:null, conn:null, role:null,
  myName:'You', oppName:'Opponent',
  gameState:null, lastView:null
};

function avatarUrlForName(name){
  if(name===CONFIG.defaultMyName && CONFIG.myAvatarUrl) return CONFIG.myAvatarUrl;
  if(name===CONFIG.defaultFriendName && CONFIG.friendAvatarUrl) return CONFIG.friendAvatarUrl;
  return null;
}

function seededOffset(id){
  var rot = ((id*137)%17)-8;
  var dx = ((id*97)%13)-6;
  var dy = ((id*53)%9)-4;
  return {rot:rot, dx:dx, dy:dy};
}

function makeRoomCode(){
  var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var s='';
  for(var i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function shareUrl(code){
  var base = location.origin + location.pathname;
  return base + '?room=' + code;
}

/* ============================================================================
   SOUND ENGINE — procedurally synthesized (no audio files, nothing to load)
   ============================================================================ */
var soundEnabled = true;
var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, type, peakGain, ctx, delay){
  delay = delay||0;
  var t0 = ctx.currentTime + delay;
  var osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type||'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(peakGain, t0+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+duration+0.03);
}
function sfx(fn){ if(!soundEnabled) return; try{ fn(getAudioCtx()); }catch(e){} }
function sfxClick(){ sfx(function(ctx){ playTone(880,0.06,'sine',0.10,ctx); }); }
function sfxCardPlay(){
  sfx(function(ctx){
    var t0=ctx.currentTime, osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type='triangle'; osc.frequency.setValueAtTime(720,t0); osc.frequency.exponentialRampToValueAtTime(210,t0+0.12);
    gain.gain.setValueAtTime(0.001,t0); gain.gain.linearRampToValueAtTime(0.20,t0+0.01); gain.gain.exponentialRampToValueAtTime(0.0001,t0+0.15);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(t0); osc.stop(t0+0.17);
  });
}
function sfxDraw(){
  sfx(function(ctx){
    var t0=ctx.currentTime, size=Math.floor(ctx.sampleRate*0.16);
    var buffer=ctx.createBuffer(1,size,ctx.sampleRate), data=buffer.getChannelData(0);
    for(var i=0;i<size;i++) data[i]=(Math.random()*2-1)*(1-i/size);
    var noise=ctx.createBufferSource(); noise.buffer=buffer;
    var filter=ctx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=1400;
    var gain=ctx.createGain(); gain.gain.setValueAtTime(0.001,t0); gain.gain.linearRampToValueAtTime(0.22,t0+0.01); gain.gain.exponentialRampToValueAtTime(0.0001,t0+0.16);
    noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination); noise.start(t0);
  });
}
function sfxTurnChime(){ sfx(function(ctx){ playTone(523.25,0.16,'sine',0.13,ctx,0); playTone(783.99,0.22,'sine',0.13,ctx,0.09); }); }
function sfxUno(){ sfx(function(ctx){ playTone(392,0.09,'square',0.08,ctx,0); playTone(523.25,0.09,'square',0.08,ctx,0.08); playTone(659.25,0.18,'square',0.10,ctx,0.16); }); }
function sfxWin(){ sfx(function(ctx){ [523.25,659.25,783.99,1046.5].forEach(function(f,i){ playTone(f,0.24,'triangle',0.13,ctx,i*0.09); }); }); }
function sfxLose(){ sfx(function(ctx){ [392,349.23,293.66].forEach(function(f,i){ playTone(f,0.32,'sine',0.10,ctx,i*0.12); }); }); }
function toggleMute(){
  soundEnabled = !soundEnabled;
  document.getElementById('mute-btn').textContent = soundEnabled ? '🔊' : '🔇';
  if(soundEnabled) sfxClick();
}

/* ============================================================================
   NETWORKING
   ============================================================================ */
function startHosting(){
  var code = makeRoomCode();
  App.role='host';
  App.peer = new Peer('uno-'+code, {debug:0});

  App.peer.on('open', function(){
    document.getElementById('share-link-input').value = shareUrl(code);
    show('lobby-hosting-panel'); hide('lobby-start');
  });
  App.peer.on('connection', function(conn){
    App.conn = conn; wireConnection(conn);
    conn.on('open', function(){ document.getElementById('hosting-status').textContent = 'Connected! Starting game…'; });
  });
  App.peer.on('error', function(err){
    console.error(err);
    if(err.type==='unavailable-id'){ startHosting(); return; }
    showToast('Connection error: '+err.type);
  });
}

function startJoining(code){
  code = normalizeCode(code);
  if(!code){ return showFieldError(activeErrorField(), 'That doesn\u2019t look like a valid code or link.'); }
  App.role='guest';
  App.peer = new Peer(undefined, {debug:0});

  App.peer.on('open', function(){
    var conn = App.peer.connect('uno-'+code, {reliable:true});
    App.conn = conn; wireConnection(conn);
    conn.on('open', function(){ conn.send({t:'join', name:App.myName}); });
  });
  App.peer.on('error', function(err){
    console.error(err);
    var msg = err.type==='peer-unavailable' ? 'Room not found. Check the code and try again.' : ('Connection error: '+err.type);
    showFieldError(activeErrorField(), msg);
  });
}

function normalizeCode(raw){
  if(!raw) return null;
  raw = raw.trim();
  var m = raw.match(/room=([A-Za-z0-9]+)/);
  if(m) return m[1].toUpperCase();
  raw = raw.replace(/[^A-Za-z0-9]/g,'');
  return raw ? raw.toUpperCase() : null;
}
function activeErrorField(){
  return document.getElementById('lobby-autojoin-panel').classList.contains('hidden') ? 'start-error' : 'autojoin-error';
}

function wireConnection(conn){
  conn.on('data', function(msg){ handleMessage(msg); });
  conn.on('close', function(){ showToast('Connection with your friend was lost.'); });
  conn.on('error', function(e){ console.error(e); showToast('A connection error occurred.'); });
}
function send(msg){ if(App.conn && App.conn.open) App.conn.send(msg); }

function handleMessage(msg){
  if(msg.t==='chat'){ appendChatMessage(msg.from, msg.text, false); return; }

  if(App.role==='host'){
    if(msg.t==='join'){
      App.oppName = msg.name || 'Player';
      document.getElementById('opp-name').textContent = App.oppName;
      beginGame();
    } else if(msg.t==='move'){
      hostHandleAction('guest', msg);
    }
  } else {
    if(msg.t==='welcome'){
      App.oppName = msg.hostName;
      document.getElementById('opp-name').textContent = App.oppName;
    } else if(msg.t==='state'){
      App.gameState = msg.view;
      enterGameScreen();
      renderGuest();
      if(msg.view.winner) showWinScreen(msg.view.winner==='guest');
    } else if(msg.t==='toast'){
      showToast(msg.msg);
    }
  }
}

/* ============================================================================
   VERIFIED GAME ENGINE (continued) — simulation-tested, unchanged
   ============================================================================ */
function beginGame(){
  send({t:'welcome', hostName:App.myName});

  var deck = shuffle(createDeck());
  var hands = { host:[], guest:[] };
  for(var i=0;i<7;i++){ hands.host.push(deck.pop()); hands.guest.push(deck.pop()); }

  var discard = [];
  var firstColor = null;
  while(true){
    var c = deck.pop();
    if(c.color==='wild'){ deck.unshift(c); deck = shuffle(deck); continue; }
    discard.push(c);
    firstColor = c.color;
    break;
  }

  var turn = Math.random()<0.5 ? 'host' : 'guest';
  var state = {
    deck:deck, discard:discard, hands:hands,
    currentColor:firstColor, turn:turn,
    awaitingPlayOrPass:false, lastDrawnId:null,
    winner:null, unoFlag:{host:false, guest:false}
  };

  var startEffect = getEffect(discard[0]);
  if(startEffect.draw>0){ for(var d=0; d<startEffect.draw; d++){ state.hands[turn].push(state.deck.pop()); } }
  if(startEffect.skip){ turn = other(turn); state.turn = turn; }

  App.gameState = state;
  enterGameScreen();
  broadcastAndRenderHost();
}

function stateForGuest(s){
  var top = s.discard[s.discard.length-1];
  return {
    myHand: s.hands.guest,
    oppCount: s.hands.host.length,
    discardTop: top,
    discardIds: s.discard.slice(-6).map(function(c){return c.id;}),
    discardCards: s.discard.slice(-6),
    deckCount: s.deck.length,
    currentColor: s.currentColor,
    turn: s.turn,
    awaitingPlayOrPass: s.turn==='guest' ? s.awaitingPlayOrPass : false,
    lastDrawnId: s.lastDrawnId,
    winner: s.winner,
    unoFlag: s.unoFlag
  };
}

function broadcastAndRenderHost(){
  var s = App.gameState;
  send({t:'state', view: stateForGuest(s)});
  renderHost();
  if(s.winner) showWinScreen(s.winner==='host');
}

function drawCards(state, player, n){
  for(var i=0;i<n;i++){
    if(state.deck.length===0) reshuffleDiscardIntoDeck(state);
    if(state.deck.length===0) break;
    state.hands[player].push(state.deck.pop());
  }
}

function reshuffleDiscardIntoDeck(state){
  if(state.discard.length<=1) return;
  var top = state.discard.pop();
  state.deck = shuffle(state.discard);
  state.discard = [top];
}

function hostHandleAction(player, msg){
  var s = App.gameState;
  if(s.winner) return;

  if(msg.a==='uno'){
    s.unoFlag[player] = true;
    var callerName = player==='host' ? App.myName : App.oppName;
    showToast(callerName+' called UNO!');
    send({t:'toast', msg:callerName+' called UNO!'});
    return;
  }

  if(s.turn !== player) return;

  if(msg.a==='draw'){
    if(s.awaitingPlayOrPass) return;
    drawCards(s, player, 1);
    var hand = s.hands[player];
    var drawn = hand[hand.length-1];
    s.lastDrawnId = drawn.id;
    var top = s.discard[s.discard.length-1];
    if(isPlayable(drawn, top, s.currentColor) && !(drawn.type==='wild4' && !canPlayWild4(hand, s.currentColor))){
      s.awaitingPlayOrPass = true;
    } else {
      s.awaitingPlayOrPass = false;
      s.turn = other(player);
    }
    broadcastAndRenderHost();
    return;
  }

  if(msg.a==='pass'){
    if(!s.awaitingPlayOrPass) return;
    s.awaitingPlayOrPass = false;
    s.lastDrawnId = null;
    s.turn = other(player);
    broadcastAndRenderHost();
    return;
  }

  if(msg.a==='play'){
    var hand2 = s.hands[player];
    if(s.awaitingPlayOrPass && msg.id !== s.lastDrawnId) return;
    var idx = -1;
    for(var i2=0;i2<hand2.length;i2++){ if(hand2[i2].id===msg.id){ idx=i2; break; } }
    if(idx===-1) return;
    var card = hand2[idx];
    var top2 = s.discard[s.discard.length-1];
    if(!isPlayable(card, top2, s.currentColor)) return;
    if(card.type==='wild4' && !canPlayWild4(hand2, s.currentColor)) return;
    if(card.color==='wild' && !msg.color) return;

    hand2.splice(idx,1);
    s.discard.push(card);
    s.currentColor = card.color==='wild' ? msg.color : card.color;
    s.awaitingPlayOrPass = false;
    s.lastDrawnId = null;

    if(hand2.length===0){
      s.winner = player;
      broadcastAndRenderHost();
      return;
    }
    if(hand2.length!==1) s.unoFlag[player]=false;

    var opp = other(player);
    var eff = getEffect(card);
    if(eff.draw>0) drawCards(s, opp, eff.draw);
    s.turn = eff.skip ? player : opp;

    broadcastAndRenderHost();
  }
}

function requestPlay(cardId, color){
  if(App.role==='host'){ hostHandleAction('host', {a:'play', id:cardId, color:color}); }
  else { send({t:'move', a:'play', id:cardId, color:color}); }
}
function requestDraw(){
  if(App.role==='host'){ hostHandleAction('host', {a:'draw'}); }
  else { send({t:'move', a:'draw'}); }
}
function requestPass(){
  if(App.role==='host'){ hostHandleAction('host', {a:'pass'}); }
  else { send({t:'move', a:'pass'}); }
}
function requestUno(){
  if(App.role==='host'){ hostHandleAction('host', {a:'uno'}); }
  else { send({t:'move', a:'uno'}); }
}

/* ============================================================================
   RENDERING
   ============================================================================ */
function el(tag, cls){ var e=document.createElement(tag); if(cls) e.className=cls; return e; }

function buildCardEl(card, faceUp){
  var c = el('div','card');
  if(!faceUp){ c.classList.add('back'); c.appendChild(el('div','crest')); return c; }
  c.classList.add(card.color);
  var badge = el('div','badge');
  var sym = cardSymbol(card);
  var center = el('div','center-symbol'); center.textContent = sym;
  badge.appendChild(center);
  var tl = el('div','corner tl'); tl.textContent = sym;
  var br = el('div','corner br'); br.textContent = sym;
  c.appendChild(badge); c.appendChild(tl); c.appendChild(br);
  return c;
}

function layoutFan(container, cards, faceUp, opts){
  opts = opts || {};
  container.innerHTML='';
  var n = cards.length;
  if(n===0) return;
  var angleStep = n<=1?0:Math.min(9, 56/n);
  var spacing = Math.min(46, 460/Math.max(n,1));
  cards.forEach(function(card, i){
    var mid=(n-1)/2, off=i-mid;
    var angle= off*angleStep;
    var x = off*spacing;
    var y = Math.abs(angle)*1.4;
    var slot = el('div','hand-slot');
    slot.style.transform = 'translateX(calc(-50% + '+x+'px)) translateY('+y+'px) rotate('+angle+'deg)';
    slot.style.zIndex = String(i);
    var cardEl = buildCardEl(card, faceUp);
    if(opts.playableCheck){
      var can = opts.playableCheck(card);
      cardEl.classList.add(can ? 'playable' : 'disabled');
      cardEl.tabIndex = can ? 0 : -1;
      cardEl.addEventListener('click', function(){ opts.onClick && opts.onClick(card); });
      cardEl.addEventListener('keydown', function(ev){ if((ev.key==='Enter'||ev.key===' ') && can){ opts.onClick && opts.onClick(card); } });
    }
    slot.appendChild(cardEl);
    container.appendChild(slot);
  });
}

function renderDiscard(cards){
  var wrap = document.getElementById('discard-stack');
  wrap.innerHTML='';
  cards.forEach(function(card, i){
    var off = seededOffset(card.id);
    var cardEl = buildCardEl(card, true);
    cardEl.style.transform = 'translate('+off.dx+'px,'+off.dy+'px) rotate('+off.rot+'deg)';
    cardEl.style.zIndex = String(i);
    if(i===cards.length-1){ cardEl.classList.add('landing'); cardEl.style.setProperty('--land-rot', off.rot+'deg'); }
    wrap.appendChild(cardEl);
  });
}

function renderDrawPile(count, canDraw){
  var wrap = document.getElementById('draw-pile');
  wrap.innerHTML='';
  var layers = Math.min(4, Math.max(1, Math.ceil(count/15)));
  for(var i=0;i<layers;i++){
    var c = buildCardEl(null,false);
    c.style.transform = 'translate('+(i*-1.5)+'px,'+(i*-1.5)+'px)';
    c.style.zIndex = String(i);
    if(!canDraw) c.classList.add('disabled');
    wrap.appendChild(c);
  }
  document.getElementById('deck-count').textContent = count+' left';
  if(count>0 && canDraw){
    wrap.style.cursor='pointer';
    wrap.onclick = function(){ var t=wrap.lastChild; if(t) t.classList.add('drawing'); requestDraw(); };
  } else { wrap.onclick=null; wrap.style.cursor='default'; }
}

function updateColorRing(color){
  var wrap = document.getElementById('discard-stack');
  wrap.querySelectorAll('.color-ring').forEach(function(r){r.remove();});
  wrap.appendChild(el('div','color-ring '+color));
}

function updateTurnBanner(isMyTurn, awaiting){
  var b = document.getElementById('turn-banner');
  if(isMyTurn){ b.classList.add('mine'); b.textContent = awaiting ? 'Play the card or pass' : 'Your Turn'; }
  else { b.classList.remove('mine'); b.textContent = (App.oppName||'Opponent') + ' is playing…'; }
}
function setActiveRow(isMyTurn){
  document.getElementById('me-row').classList.toggle('active', isMyTurn);
  document.getElementById('opp-row').classList.toggle('active', !isMyTurn);
}
function renderAvatar(containerId, name){
  var container = document.getElementById(containerId);
  container.innerHTML='';
  var url = avatarUrlForName(name);
  if(url){ var img = el('img','avatar-img'); img.src=url; img.alt=name; container.appendChild(img); }
  else { var initial = el('div','avatar-initial'); initial.textContent = (name||'?').trim().charAt(0).toUpperCase(); container.appendChild(initial); }
}

function playSoundsForTransition(prev, view, myRole){
  if(!prev) return;
  if(view.discardTop && prev.discardTop && view.discardTop.id !== prev.discardTop.id) sfxCardPlay();
  var myPrevCount = prev.myHand.length, myNowCount = view.myHand.length;
  var oppPrevCount = prev.oppCount, oppNowCount = view.oppCount;
  var discardChanged = view.discardTop && prev.discardTop && view.discardTop.id !== prev.discardTop.id;
  if(!discardChanged && (myNowCount>myPrevCount || oppNowCount>oppPrevCount)) sfxDraw();
  var wasMyTurn = prev.turn===myRole, isMyTurnNow = view.turn===myRole;
  if(!wasMyTurn && isMyTurnNow && !view.winner) sfxTurnChime();
  if(!prev.winner && view.winner) (view.winner===myRole) ? sfxWin() : sfxLose();
}

function renderCommon(view, myRole){
  document.getElementById('me-name').textContent = App.myName;
  document.getElementById('opp-name').textContent = App.oppName;
  renderAvatar('me-avatar', App.myName);
  renderAvatar('opp-avatar', App.oppName);

  playSoundsForTransition(App.lastView, view, myRole);
  App.lastView = view;

  var isMyTurn = view.turn === myRole;
  setActiveRow(isMyTurn);
  updateTurnBanner(isMyTurn, view.awaitingPlayOrPass);
  renderDiscard(view.discardCards || (view.discardTop?[view.discardTop]:[]));
  updateColorRing(view.currentColor);
  renderDrawPile(view.deckCount, isMyTurn && !view.awaitingPlayOrPass);

  var oppFan = document.getElementById('opp-fan');
  var oppCards=[]; for(var i=0;i<view.oppCount;i++) oppCards.push({id:'o'+i});
  layoutFan(oppFan, oppCards, false, {});

  var handFan = document.getElementById('hand-fan');
  var canInteract = isMyTurn;
  layoutFan(handFan, view.myHand, true, {
    playableCheck:function(card){
      if(!canInteract) return false;
      if(view.awaitingPlayOrPass) return card.id===view.lastDrawnId;
      var top = view.discardTop;
      if(!isPlayable(card, top, view.currentColor)) return false;
      if(card.type==='wild4' && !canPlayWild4(view.myHand, view.currentColor)) return false;
      return true;
    },
    onClick:function(card){ onHandCardClick(card); }
  });

  var passBtn = document.getElementById('pass-btn');
  passBtn.classList.toggle('hidden', !(isMyTurn && view.awaitingPlayOrPass));
  passBtn.onclick = function(){ sfxClick(); requestPass(); };

  var unoBtn = document.getElementById('uno-btn');
  unoBtn.classList.toggle('hidden', view.myHand.length!==1);
  unoBtn.onclick = function(){ sfxUno(); requestUno(); };
}

function renderHost(){
  var s = App.gameState;
  renderCommon({
    myHand: s.hands.host, oppCount: s.hands.guest.length,
    discardTop: s.discard[s.discard.length-1], discardCards: s.discard.slice(-6),
    deckCount: s.deck.length, currentColor: s.currentColor, turn: s.turn,
    awaitingPlayOrPass: s.turn==='host' ? s.awaitingPlayOrPass : false,
    lastDrawnId: s.lastDrawnId, winner: s.winner
  }, 'host');
}
function renderGuest(){ renderCommon(App.gameState, 'guest'); }

function onHandCardClick(card){
  sfxClick();
  if(card.color==='wild'){ showColorModal(function(chosenColor){ requestPlay(card.id, chosenColor); }); }
  else { requestPlay(card.id, null); }
}
function showColorModal(cb){
  var modal = document.getElementById('color-modal');
  modal.classList.remove('hidden');
  var buttons = modal.querySelectorAll('.swatch');
  function cleanup(){ buttons.forEach(function(b){ b.onclick=null; }); modal.classList.add('hidden'); }
  buttons.forEach(function(b){ b.onclick = function(){ var color=b.getAttribute('data-color'); cleanup(); cb(color); }; });
}
function showToast(msg){
  var container = document.getElementById('toast-container');
  var t = el('div','toast'); t.textContent = msg;
  container.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(function(){ t.remove(); }, 300); }, 2400);
}
function showWinScreen(iWon){
  var screen = document.getElementById('win-screen');
  var title = document.getElementById('win-title');
  var sub = document.getElementById('win-sub');
  title.textContent = iWon ? 'You Won! 🎉' : (App.oppName+' Won');
  title.className = iWon ? 'won' : 'lost';
  sub.textContent = iWon ? 'Nicely played.' : 'Better luck on the next round.';
  screen.classList.remove('hidden');
  spawnConfetti(screen, iWon);
}
function spawnConfetti(container, celebratory){
  container.querySelectorAll('.confetti').forEach(function(o){o.remove();});
  if(!celebratory) return;
  var colorVals = {red:'var(--red)', yellow:'var(--amber)', green:'var(--green)', blue:'var(--blue)'};
  var keys = Object.keys(colorVals);
  for(var i=0;i<70;i++){
    var pc = el('div','confetti');
    pc.style.left = Math.random()*100+'%';
    pc.style.background = colorVals[keys[i%4]];
    pc.style.animationDuration = (2.2+Math.random()*1.6)+'s';
    pc.style.animationDelay = (Math.random()*0.6)+'s';
    pc.style.borderRadius = Math.random()<0.5 ? '50%' : '2px';
    container.appendChild(pc);
  }
}

/* ============================================================================
   CHAT
   ============================================================================ */
function appendChatMessage(from, text, isMe){
  var list = document.getElementById('chat-messages');
  var row = el('div', 'chat-msg'+(isMe?' me':''));
  var author = el('div','chat-author'); author.textContent = from;
  var bubble = el('div','chat-bubble'); bubble.textContent = text;
  row.appendChild(author); row.appendChild(bubble);
  list.appendChild(row);
  list.scrollTop = list.scrollHeight;
}
function sendChat(){
  var input = document.getElementById('chat-input');
  var text = input.value.trim();
  if(!text) return;
  input.value='';
  appendChatMessage(App.myName, text, true);
  send({t:'chat', from:App.myName, text:text});
}

/* ============================================================================
   SCREEN / LOBBY FLOW
   ============================================================================ */
function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }
function showFieldError(fieldId, msg){ document.getElementById(fieldId).textContent = msg; }
function enterGameScreen(){ hide('lobby-screen'); show('game-screen'); document.getElementById('win-screen').classList.add('hidden'); }

function buildHeroFan(){
  var demo = [
    {id:9001,color:'red',type:'skip'}, {id:9002,color:'yellow',type:'number',value:7},
    {id:9003,color:'green',type:'reverse'}, {id:9004,color:'blue',type:'draw2'},
    {id:9005,color:'wild',type:'wild'}
  ];
  layoutFan(document.getElementById('hero-fan'), demo, true, {});
}

document.addEventListener('DOMContentLoaded', function(){
  buildHeroFan();
  document.getElementById('name-input').value = CONFIG.defaultMyName;
  document.getElementById('autojoin-name-input').value = CONFIG.defaultFriendName;

  document.getElementById('create-btn').addEventListener('click', function(){
    sfxClick(); getAudioCtx();
    var name = document.getElementById('name-input').value.trim();
    if(!name){ return showFieldError('start-error','Enter your name first.'); }
    App.myName = name;
    startHosting();
  });
  document.getElementById('show-join-btn').addEventListener('click', function(){
    sfxClick(); hide('lobby-choice-buttons'); show('lobby-join-panel'); showFieldError('start-error','');
  });
  document.getElementById('join-back-btn').addEventListener('click', function(){
    hide('lobby-join-panel'); show('lobby-choice-buttons'); showFieldError('start-error','');
  });
  document.getElementById('join-submit-btn').addEventListener('click', function(){
    sfxClick(); getAudioCtx();
    var name = document.getElementById('name-input').value.trim();
    if(!name){ return showFieldError('start-error','Enter your name first.'); }
    App.myName = name;
    startJoining(document.getElementById('join-code-input').value);
  });
  document.getElementById('autojoin-btn').addEventListener('click', function(){
    sfxClick(); getAudioCtx();
    var name = document.getElementById('autojoin-name-input').value.trim();
    if(!name){ return showFieldError('autojoin-error','Enter your name first.'); }
    App.myName = name;
    startJoining(window.__autoJoinCode);
  });
  document.getElementById('copy-link-btn').addEventListener('click', function(){
    sfxClick();
    var input = document.getElementById('share-link-input');
    input.select(); input.setSelectionRange(0,999);
    navigator.clipboard && navigator.clipboard.writeText(input.value).catch(function(){});
    try{ document.execCommand('copy'); }catch(e){}
    var btn = document.getElementById('copy-link-btn');
    var old = btn.textContent; btn.textContent='Copied!';
    setTimeout(function(){ btn.textContent = old; }, 1400);
  });
  document.getElementById('play-again-btn').addEventListener('click', function(){
    sfxClick();
    document.getElementById('win-screen').classList.add('hidden');
    if(App.role==='host'){ beginGame(); }
    else { showToast('Waiting for '+App.oppName+' to start a new round…'); }
  });

  document.getElementById('mute-btn').addEventListener('click', toggleMute);
  document.getElementById('chat-send-btn').addEventListener('click', sendChat);
  document.getElementById('chat-input').addEventListener('keydown', function(ev){ if(ev.key==='Enter') sendChat(); });

  var params = new URLSearchParams(location.search);
  var roomParam = params.get('room');
  if(roomParam){
    window.__autoJoinCode = roomParam;
    document.getElementById('autojoin-code-badge').textContent = 'Room '+roomParam.toUpperCase();
    hide('lobby-start');
    show('lobby-autojoin-panel');
  }
});

})();
</script>
